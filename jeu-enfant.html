<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu pour Enfant</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', sans-serif;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    text-align: center;
    color: #ff6b6b;
    font-size: 2.5em;
    margin: 10px;
    text-shadow: 2px 2px 0 #fff;
  }
  #score {
    text-align: center;
    font-size: 2em;
    color: #4a4a4a;
  }
  #zone {
    width: 100vw;
    height: 80vh;
    position: relative;
  }
  .forme {
    position: absolute;
    cursor: pointer;
    transition: transform 0.2s;
    font-size: 100px;
    animation: bounce 1s infinite alternate;
  }
  .forme:hover { transform: scale(1.2); }
  .forme:active { transform: scale(0.9); }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-15px); }
  }
  .pop {
    position: absolute;
    font-size: 60px;
    animation: popUp 1s forwards;
    pointer-events: none;
  }
  @keyframes popUp {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2) translateY(-100px); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>🎈 Touche les animaux ! 🎈</h1>
  <div id="score">⭐ 0</div>
  <div id="zone"></div>

<script>
  const emojis = ['🐶','🐱','🐰','🐻','🦁','🐼','🐸','🐵','🦊','🐨','🐷','🐔','🦄','🐢','🐙'];
  const bravos = ['BRAVO !','SUPER !','WAOUH !','GÉNIAL !','YOUPI !'];
  const sons = ['🎉','✨','🌟','💫','⭐'];
  let score = 0;
  const zone = document.getElementById('zone');
  const scoreEl = document.getElementById('score');

  function jouerSon() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 400 + Math.random() * 600;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
  }

  function nouvelAnimal() {
    const el = document.createElement('div');
    el.className = 'forme';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (zone.clientHeight - 120);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.addEventListener('click', () => toucher(el, x, y));
    el.addEventListener('touchstart', (e) => { e.preventDefault(); toucher(el, x, y); });
    zone.appendChild(el);
  }

  function toucher(el, x, y) {
    score++;
    scoreEl.textContent = '⭐ ' + score;
    jouerSon();

    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.textContent = sons[Math.floor(Math.random() * sons.length)] + ' ' + bravos[Math.floor(Math.random() * bravos.length)];
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    pop.style.color = `hsl(${Math.random()*360}, 80%, 50%)`;
    zone.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);

    el.remove();
    nouvelAnimal();
  }

  for (let i = 0; i < 3; i++) nouvelAnimal();
</script>
</body>
</html>
