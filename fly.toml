# Configuration Fly.io pour Check BTP
# https://fly.io/docs/reference/configuration/

app = "check-btp"
primary_region = "cdg"  # Paris (datacenter français pour souveraineté RGPD)
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

# Volume persistant pour SQLite (3 GB gratuit)
[mounts]
  source = "check_btp_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # 0 pour économiser le free tier (cold start ~3s, vs 50s sur Render)
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Free tier
